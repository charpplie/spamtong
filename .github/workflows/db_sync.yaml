name: DB Sync

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db-sync:
    runs-on: self-hosted

    steps:
      - name: Create db_sync folde
        run: |
          chmod +x ./db_sync.sh
          ./db_sync.sh
        shell: bash

      - name: Push to Repository
        uses: tech-thinker/push-to-repo@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.TOKEN }}
        with:
          user-name: "charpplie[bot]"
          source-directory: "dbsync"
          destination-github-username: "charpplie"
          destination-repository-name: "SpamtongDatabase"
          target-branch: master