name: CI/CD Workflow

on:
  workflow_dispatch:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3

      - run: npm install

      - name: Run Spamtong on self-hosted runner
        run: |
            if screen -ls | grep -q "spamtong"; then
              screen -X -S spamtong quit
              screen -dmS spamtong
              screen -S spamtong bash -c "cd actions-runner/_work/spamtong/spamtong && npm run dev"
            else
              screen -dmS spamtong
              screen -S spamtong bash -c "cd actions-runner/_work/spamtong/spamtong && npm run dev"
            fi
            screen -ls
