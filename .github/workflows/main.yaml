name: Main

on: 
  workflow_dispatch:
  push:
    branches:
    - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prodbuild:
    runs-on: self-hosted
    steps:
      - name: Run Spamtong on self-hosted runner via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host:     ${{ secrets.HOST      }}
          username: ${{ secrets.USERNAME  }}
          password: ${{ secrets.PASSWD    }}
          port:     ${{ secrets.PORT      }}
          script: |
            tmux kill-sesion -t spamtong
            tmux new -s spamtong
            tmux attach -t spamtong1
            cd spamtong
            git pull
            npm start