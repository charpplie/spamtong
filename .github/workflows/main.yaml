name: CI/CD Workflow

on:
  workflow_dispatch:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3

      - run: npm install

      - name: Run Spamtong on self-hosted runner
        run: |
          chmod +x run.sh
          ./run.sh