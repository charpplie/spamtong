name: CI/CD Workflow

on:
  workflow_dispatch:
  push:
    branches: master
  pull_request:
    branches: master
    

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and run
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      
      - name: Install Node dependencies
        run: npm install
      
      - name: Run Node project
        run: npm run dev > /dev/null 2>&1 & echo $! > project_pid
        
      - name: Wait for project to start
        run: sleep 60
        
      - name: Finish GitHub ACtions
        run: killall npm || true
