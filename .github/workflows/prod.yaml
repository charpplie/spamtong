name: Prod

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prodbuild:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Update version in local repo
        run: |
          chmod +x scripts/version.sh
          cd scripts
          ./version.sh "-github ${{ secrets.API }}" "-branch master"

      - name: Push version to Tracking repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API }}
        with:
          source-directory: 'output'
          destination-github-username: 'charpplie'
          destination-repository-name: 'SpamtongTracking'
          user-email: maksohuman@gmail.com
          target-branch: master

      - uses: actions/setup-node@v3

      - run: npm install

      - name: Run Spamtong on self-hosted runner via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USERNAME }}
            password: ${{ secrets.PASSWD }}
            script: |
              screen -ls | grep spamtong | cut -d. -f1 | awk '{print $1}' | xargs -r kill
              screen -dmS spamtong
              screen -S spamtong -X command 'cd actions-runner/_work/spamtong/spamtong/scripts\n'
              screen -S spamtong -X command 'chmod +x run.sh\n'
              screen -S spamtong -X command './run.sh -discord ${{ secrets.TOKEN }} -client ${{ secrets.CLIENT_ID }}\n'
